name: educlouderp

services:
  database:
    image: postgres:16
    container_name: educlouderp_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - educlouderp_pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    networks:
      - educlouderp_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: educlouderp_backend
    restart: unless-stopped
    depends_on:
      - database
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - educlouderp_network
    command: npm run dev

  frontend:
    container_name: educlouderp_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV}
      VITE_API_URL: ${FRONTEND_API_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - educlouderp_network
    command: npm run dev -- --host 0.0.0.0

volumes:
  educlouderp_pgdata:

networks:
  educlouderp_network:
    driver: bridge
